<div class="card">
  @if (fotoPrincipal) {
    <img [src]="fotoPrincipal" [alt]="nombre" class="card__foto" />
  }
  <div class="card__cuerpo">
    <h2 class="card__nombre">{{ nombre }}</h2>
    <span class="card__frase">{{ frasePresentacion }}</span>
    <p class="card__texto">{{ texto }}</p>

    <button type="button" class="card__boton" (click)="onBotonClick()">
      Ver detalles 
    </button>
  </div>
</div>
